# Builds and publishes a GitHub release whenever a semver tag is pushed.
#
#   make release TAG=v4.7.0
#
# The tag is the single source of truth for the version: GoReleaser injects it
# into app.VERSION via -ldflags, so the binary always reports the tag it was cut from.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GoReleaser creates the release and uploads the archives

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs the full history to build the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
