# Builds and publishes a GitHub release whenever a semver tag is pushed.
#
#   make release TAG=v4.7.0
#
# The tag is the single source of truth for the version: GoReleaser injects it
# into app.VERSION via -ldflags, so the binary always reports the tag it was cut from.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # GoReleaser creates the release and uploads the archives

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs the full history to build the changelog

      # Releases are cut from main only. `make release` enforces this locally, but
      # a hand-made `git tag` bypasses it, so the workflow refuses to publish a
      # tag whose commit never reached main - the branch GitHub Pages serves too.
      - name: Verify the tag is on main
        run: |
          git fetch origin main --depth=0
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main. Merge develop into main first (make merge_to_main), then re-tag."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
