<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">S0 meter connected through a PC817 optocoupler (U1)</title>
  <desc id="d">A separate 12 to 24 volt supply drives the LED of a PC817 optocoupler (pin 1 anode, pin 2 cathode) through the reverse-polarity diode D1, the series resistor R1 and the meter's S0 output. The PC817's transistor connects GPIO17 (header pin 11) of the Raspberry Pi, pulled up to 3.3 volt by the optional 10 kilohm resistor R2, to GND (pin 9): collector pin 4, emitter pin 3. A dashed line through the optocoupler marks the galvanic isolation.</desc>
  <style>
    .wire { stroke: #17202b; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .box { fill: #ffffff; stroke: #c3cbd4; stroke-width: 1.5; }
    .res { fill: #ffffff; stroke: #17202b; stroke-width: 2; }
    .opto { fill: #f3f5f7; stroke: #8a97a5; stroke-width: 1.5; }
    .iso { stroke: #b3261e; stroke-width: 1.5; stroke-dasharray: 6 5; }
    .led { fill: #e8231a; stroke: #b3261e; stroke-width: 1.5; }
    .ray { stroke: #e8231a; stroke-width: 1.6; fill: none; }
    .rayhead { fill: #e8231a; }
    .term { fill: #ffffff; stroke: #17202b; stroke-width: 2; }
    .dot { fill: #17202b; }
    .t { fill: #17202b; font-size: 14px; }
    .tb { fill: #17202b; font-size: 15px; font-weight: 600; }
    .tm { fill: #5d6b7a; font-size: 12.5px; }
    .pin { fill: #5d6b7a; font-size: 11px; font-weight: 600; }
    .tz { fill: #5d6b7a; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; }
    .tiso { fill: #b3261e; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
    .ic { fill: #dde2e8; stroke: #5d6b7a; stroke-width: 1.5; }
    .icpin { fill: #b9c1ca; stroke: #5d6b7a; stroke-width: 1.2; }
    .icmark { fill: #5d6b7a; }
    .diode { fill: #17202b; stroke: #17202b; stroke-width: 1.5; stroke-linejoin: round; }
    .pi { fill: #e8f0fa; stroke: #2563a8; stroke-width: 1.5; }
    .tpi { fill: #2563a8; font-size: 15px; font-weight: 600; }
    @media (prefers-color-scheme: dark) {
      .wire { stroke: #e6ebf0; }
      .box { fill: #19212a; stroke: #3a4756; }
      .res { fill: #19212a; stroke: #e6ebf0; }
      .opto { fill: #11161c; stroke: #6b7a8a; }
      .term { fill: #19212a; stroke: #e6ebf0; }
      .dot { fill: #e6ebf0; }
      .t, .tb { fill: #e6ebf0; }
      .tm, .tz, .pin { fill: #93a1b0; }
      .ic { fill: #2a3440; stroke: #8a97a5; }
      .icpin { fill: #4a5664; stroke: #8a97a5; }
      .icmark { fill: #93a1b0; }
      .diode { fill: #e6ebf0; stroke: #e6ebf0; }
      .pi { fill: #142233; stroke: #6ea8e6; }
      .tpi { fill: #6ea8e6; }
      .iso { stroke: #f07a70; }
      .tiso { fill: #f07a70; }
    }
  </style>

  <!-- zone labels -->
  <text class="tz" x="40" y="20">Meter side · own 12–24 V supply</text>
  <text class="tz" x="560" y="20">Raspberry Pi side · 3.3 V</text>

  <g transform="translate(0 30)">
  <!-- PC817, DIP-4: pins 1 (anode) and 2 (cathode) left, 4 (collector) and 3 (emitter) right -->
  <rect class="icpin" x="378" y="91" width="14" height="10" rx="1.5"/>
  <rect class="icpin" x="378" y="145" width="14" height="10" rx="1.5"/>
  <rect class="icpin" x="518" y="91" width="14" height="10" rx="1.5"/>
  <rect class="icpin" x="518" y="145" width="14" height="10" rx="1.5"/>
  <rect class="ic" x="390" y="70" width="130" height="110" rx="5"/>
  <circle class="icmark" cx="402" cy="80" r="3"/>
  <text class="pin" x="370" y="88" text-anchor="end">1</text>
  <text class="pin" x="370" y="168" text-anchor="end">2</text>
  <text class="pin" x="540" y="88">4</text>
  <text class="pin" x="540" y="168">3</text>
  <text class="tb" x="455" y="206" text-anchor="middle">U1 · PC817</text>
  <text class="tm" x="455" y="222" text-anchor="middle">optocoupler</text>
  <line class="iso" x1="455" y1="10" x2="455" y2="186"/>
  <line class="iso" x1="455" y1="232" x2="455" y2="272"/>
  <text class="tiso" x="455" y="292" text-anchor="middle">galvanic isolation</text>

  <!-- inside: LED from pin 1 to pin 2 -->
  <path class="wire" d="M392 96 H425 V104"/>
  <path class="led" d="M413 104 H437 L425 126 Z"/>
  <line class="wire" x1="411" y1="127" x2="439" y2="127"/>
  <path class="wire" d="M425 127 V150 H392"/>
  <path class="ray" d="M441 108 L461 99"/>
  <path class="ray" d="M441 120 L461 111"/>
  <path class="rayhead" d="M463 98 L456 98 L459 103 Z"/>
  <path class="rayhead" d="M463 110 L456 110 L459 115 Z"/>

  <!-- inside: phototransistor, collector to pin 4, emitter to pin 3 -->
  <line class="wire" x1="476" y1="100" x2="476" y2="140" style="stroke-width:3"/>
  <path class="wire" d="M476 110 L496 96 H518"/>
  <path class="wire" d="M476 130 L496 150 H518"/>
  <path class="dot" d="M496 150 L486 148 L492 141 Z"/>

  <!-- meter with its S0 switch -->
  <rect class="box" x="40" y="130" width="140" height="130" rx="10"/>
  <text class="tb" x="56" y="154">Meter</text>
  <text class="tm" x="56" y="172">S0 output</text>
  <path class="wire" d="M180 190 H140 V200 M140 236 V246 H180"/>
  <path class="wire" d="M140 200 L156 230"/>
  <circle class="dot" cx="140" cy="200" r="2.6"/>
  <circle class="dot" cx="140" cy="236" r="2.6"/>

  <!-- supply + -> D1 -> R1 -> pin 1 ; pin 2 -> S0+ ; S0- -> supply 0 V -->
  <path class="wire" d="M65 80 H146"/>
  <path class="diode" d="M146 71 L146 89 L162 80 Z"/>
  <line class="wire" x1="164" y1="70" x2="164" y2="90" style="stroke-width:2.5"/>
  <text class="tb" x="155" y="60" text-anchor="middle">D1</text>
  <text class="tm" x="155" y="110" text-anchor="middle">1N4148</text>
  <path class="wire" d="M164 80 H220"/>
  <rect class="res" x="220" y="70" width="60" height="20" rx="3"/>
  <text class="tb" x="250" y="60" text-anchor="middle">R1</text>
  <text class="tm" x="250" y="110" text-anchor="middle">2.2 kΩ ½ W at 24 V</text>
  <text class="tm" x="250" y="126" text-anchor="middle">1 kΩ at 12 V</text>
  <path class="wire" d="M280 80 H340 V96 H378"/>
  <path class="wire" d="M378 150 H300 V190 H185"/>
  <path class="wire" d="M185 246 H313"/>
  <circle class="term" cx="60" cy="80" r="5"/>
  <text class="tb" x="40" y="60">+12–24 V</text>
  <circle class="term" cx="180" cy="190" r="5"/>
  <circle class="term" cx="180" cy="246" r="5"/>
  <text class="t" x="192" y="184">S0+</text>
  <text class="t" x="192" y="240">S0−</text>
  <circle class="term" cx="318" cy="246" r="5"/>
  <text class="t" x="304" y="272">0 V</text>
  <text class="tm" x="304" y="288">supply −</text>

  <!-- pin 4 -> GPIO17 with 10 kΩ pull-up to 3V3 ; pin 3 -> GND -->
  <path class="wire" d="M532 96 H645"/>
  <path class="wire" d="M532 150 H645"/>
  <path class="wire" d="M645 16 H600 V26"/>
  <rect class="res" x="590" y="26" width="20" height="60" rx="3"/>
  <path class="wire" d="M600 86 V96"/>
  <circle class="dot" cx="600" cy="96" r="3"/>
  <text class="tb" x="582" y="36" text-anchor="end">R2</text>
  <text class="tm" x="582" y="54" text-anchor="end">10 kΩ</text>
  <text class="tm" x="582" y="70" text-anchor="end">optional</text>

  <!-- Raspberry Pi header -->
  <rect class="pi" x="650" y="0" width="130" height="194" rx="10"/>
  <circle class="term" cx="650" cy="16" r="5"/>
  <circle class="term" cx="650" cy="96" r="5"/>
  <circle class="term" cx="650" cy="150" r="5"/>
  <text class="t" x="664" y="21">3V3</text>
  <text class="tm" x="704" y="21">pin 1</text>
  <text class="t" x="664" y="101">GPIO17</text>
  <text class="tm" x="664" y="117">pin 11</text>
  <text class="t" x="664" y="155">GND</text>
  <text class="tm" x="704" y="155">pin 9</text>
  <text class="tpi" x="715" y="180" text-anchor="middle">Raspberry Pi</text>
  </g>
</svg>
