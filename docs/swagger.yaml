definitions:
  health.Model:
    properties:
      app:
        description: Application name (MODULE)
        type: string
      appVersion:
        description: Current version of the application
        type: string
      goVersion:
        description: Go runtime version
        type: string
      heapAllocBytes:
        description: Allocated heap memory in bytes
        type: integer
      hostname:
        description: Machine name where the app runs
        type: string
      meters:
        additionalProperties:
          $ref: '#/definitions/s0meters.MeterStatus'
        description: |-
          Meters holds the diagnostic state per meter name: raw pulses, the last pulse and the
          GPIO events lost since the last start or reload. Filled in by the caller.
        type: object
      mqtt:
        description: |-
          Mqtt is the state of the broker connection: connected, disconnected (also while
          reconnecting) or disabled when no broker is configured. Filled in by the caller.
        type: string
      numGoroutines:
        description: Current number of active goroutines
        type: integer
      os:
        description: Operating system name
        type: string
      sysMemoryBytes:
        description: Total memory obtained from the OS
        type: integer
      timestamp:
        description: UTC timestamp when health info was collected (RFC3339)
        type: string
      uptimeSeconds:
        description: Application uptime in seconds
        type: number
    type: object
  s0meters.Display:
    properties:
      counter:
        description: Counter in CounterUnit
        type: number
      counterPrecision:
        description: Decimal places of Counter
        type: integer
      counterUnit:
        description: DisplayUnit, or the configured counterUnit
        type: string
      gauge:
        description: Gauge in GaugeUnit
        type: number
      gaugePrecision:
        description: Decimal places of Gauge
        type: integer
      gaugeUnit:
        description: DisplayGaugeUnit, or the configured gaugeUnit
        type: string
    type: object
  s0meters.MeterData:
    properties:
      counter:
        description: Total meter value in CounterUnit
        type: number
      counterUnit:
        description: Counter unit
        type: string
      gauge:
        description: Flow rate in GaugeUnit
        type: number
      gaugeUnit:
        description: Gauge unit
        type: string
      meter:
        description: Meter name from the config, like ecoflowd's "sn"
        type: string
      timestamp:
        description: Time of the reading, local time, whole seconds
        type: string
    type: object
  s0meters.MeterStatus:
    properties:
      display:
        allOf:
        - $ref: '#/definitions/s0meters.Display'
        description: Counter and gauge in the display units
      droppedEvents:
        description: GPIO events lost since start or reload, see pulsecounter
        type: integer
      gpio:
        description: GPIO the meter is wired to (BCM numbering)
        type: integer
      lastPulse:
        description: Time of the last pulse, local time, whole seconds
        type: string
      lastPulseAgeSeconds:
        description: Seconds since the last pulse, one decimal place
        type: number
      pulses:
        description: Raw pulse count, including restored pulses
        type: integer
    type: object
info:
  contact: {}
paths:
  /health:
    get:
      description: Retrieves memory usage, goroutine count, version, hostname, Go
        runtime version, OS, the MQTT connection state, and per meter the raw pulses,
        the time and age of the last pulse, the GPIO events lost (counted late, the
        gauge skips the gap) and the reading in the display units of the web UI.
      produces:
      - application/json
      responses:
        "200":
          description: Health data successfully retrieved
          schema:
            $ref: '#/definitions/health.Model'
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get health data
      tags:
      - info
  /meters:
    get:
      description: Returns the current counter and gauge values for all registered
        S0 meters, keyed by meter name.
      produces:
      - application/json
      responses:
        "200":
          description: Meter readings successfully retrieved
          schema:
            additionalProperties:
              $ref: '#/definitions/s0meters.MeterData'
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get all meter readings
      tags:
      - meters
  /meters/{name}:
    get:
      description: Returns the current counter and gauge values for a specific S0
        meter by name.
      parameters:
      - description: Meter name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Meter reading successfully retrieved
          schema:
            $ref: '#/definitions/s0meters.MeterData'
        "401":
          description: Unauthorized
          schema:
            type: string
        "404":
          description: Meter not found
          schema:
            type: string
      security:
      - ApiKeyAuth: []
      summary: Get single meter reading
      tags:
      - meters
  /ready:
    get:
      description: Returns 200 while the service delivers readings, 503 while a configured
        MQTT broker is not connected. No authentication required.
      produces:
      - application/json
      responses:
        "200":
          description: Application is ready
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: MQTT broker not connected
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Readiness check
      tags:
      - info
  /version:
    get:
      description: Returns the current application name and version. No authentication
        required.
      produces:
      - application/json
      responses:
        "200":
          description: Application version and name
          schema:
            properties:
              app:
                type: string
              appVersion:
                type: string
            type: object
      summary: Get application version and name
      tags:
      - info
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
